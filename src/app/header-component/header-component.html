<header class="header">
    <div class="header-logo">
        <a routerLink="/">AnissaAutoMarket</a>
    </div>

    <nav class="header-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Accueil
        </a>
        <a routerLink="/cart" routerLinkActive="active">
            🛒 Panier
            @if (cartCount > 0) {
            <span class="badge">{{ cartCount }}</span>
            }
        </a>

        @if (isLoggedIn) {
        <a routerLink="/checkout" routerLinkActive="active">Commande</a> 
        <span class="user-email">{{ userEmail }}</span>
        <a (click)="logout()" class="btn-logout">Déconnexion</a>
        } @else {
        <a routerLink="/register" routerLinkActive="active">Inscription</a>
        <a routerLink="/login" routerLinkActive="active">Connexion</a>
        }
        @if (isAdmin) {
        <a routerLink="/admin" routerLinkActive="active">Administration</a>
        }
    </nav>
</header>
