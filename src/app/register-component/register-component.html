<div class="login-container">
    <div class="login-card">

        <h2>Inscription</h2>

        @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
        }

        @if (successMessage) {
        <p class="success">{{ successMessage }}</p>
        }

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" [(ngModel)]="email" placeholder="votre@email.com" />
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input id="password" type="password" [(ngModel)]="password" placeholder="••••••••" />
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirmer le mot de passe</label>
            <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" placeholder="••••••••" />
        </div>

        <button (click)="onRegister()">S'inscrire</button>

        <p class="link">
            Déjà un compte ? <a routerLink="/login">Se connecter</a>
        </p>

    </div>
</div>
